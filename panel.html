<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="60">
    <title>Панель состояний — Оповещение Сочи и Туапсе</title>
    <meta name="description" content="Информационный портал оповещение Сочи и Туапсе">
    <link rel="stylesheet" href="css.css">
    <link rel="shortcut icon" type="image/x-icon" href="img.ico">
    <link rel="icon" type="image/png" href="img.png">
    <script src="status-panel.js" defer></script>
</head>
<body class="status-page-body">
    <main class="status-page">
        <section class="status-panel" aria-label="Статусы городов">
            <img class="status-hero" src="status-panel.png" alt="Оповещение: Сочи и Туапсе">

            <div class="status-eyebrow-row">
                <p class="status-eyebrow">ПАНЕЛЬ СОСТОЯНИЙ</p>
                <time class="moscow-clock" id="moscow-clock">--:--:--</time>
            </div>

            <div class="city-grid" id="city-grid" aria-live="polite">
                <article class="city-card" data-city="Сочи">
                    <div class="card-top"><span class="status-mark" aria-hidden="true"></span></div>
                    <h2>Сочи</h2>
                    <p class="status-label">Загрузка…</p>
                </article>
                <article class="city-card" data-city="Туапсе">
                    <div class="card-top"><span class="status-mark" aria-hidden="true"></span></div>
                    <h2>Туапсе</h2>
                    <p class="status-label">Загрузка…</p>
                </article>
                <article class="city-card" data-city="Краснодарский край">
                    <div class="card-top"><span class="status-mark" aria-hidden="true"></span></div>
                    <h2>Краснодарский край</h2>
                    <p class="status-label">Загрузка…</p>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
